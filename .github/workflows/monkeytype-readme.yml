name: generate monkeytype readme svg

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Monkeytype Readme
        run: |
          mkdir -p public
          curl -sSL -o public/monkeytype-readme.svg "https://monkeytype-readme.vercel.app/generate-svg/Dannzz/midnight"

      - name: Push monkeytype-readme.svg to the monkeytype-readme branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: monkeytype-readme
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
